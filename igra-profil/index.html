function vFamOk() {

function vFamRes() {

  var ga = a.F3 || [], gb = b.F3 || [];

  var diff = [], agree = [];
  F[3].o.forEach(function (v) { var x = (a.F4 || {})[v], y = (b.F4 || {})[v]; if (x && y) (x === y ? agree : diff).push(v); });
  function who(p, t) { return '<div><b>Участник ' + p + '</b>' + esc(t || 'не указано') + '</div>'; }
  var start = a.F7 && a.F7 === b.F7 ? 'Вы оба выбрали: «' + esc(a.F7) + '». Договоритесь о дне и начните.' :
    'Участник 1 предложил «' + esc(a.F7 || '—') + '», участник 2 — «' + esc(b.F7 || '—') + '». Выберите одно и попробуйте в ближайшие две недели.';
  return sec(
    '<div class="g-res"><div class="eyebrow">ВАША ОБЩАЯ КАРТА</div><div class="g-res-ico"><div>' + img('semya') + '</div><div>' + img('rol') + '</div></div>' +
      '<h2>Вместе, <span>но каждый — в своём</span></h2><p>Хорошая команда — это не одинаковые ответы, а понятно разделённые роли.</p></div>' +

    '<div class="g-card"><h3>' + img('tsel') + 'Общие цели</h3><p>' + (same.length ? 'Вам обоим важно: ' + esc(same.join(', ').toLowerCase()) + '. Это ваша опора.' : 'Совпадений нет — это нормально. Расскажите друг другу, почему выбрали именно это.') + '</p></div>' +

var VIEWS = { intro: vIntro, quiz: vQuiz, result: vResult, famIntro: vFamIntro, famQ: vFamQ, famOk: vFamOk, famSwitch: vFamSwitch, famRes: vFamRes };
function render() {
  APP.innerHTML = VIEWS[S.scr]();
  try { window.scrollTo(0, 0); } catch (e) {}
  var t = document.getElementById('gText'); if (t) t.addEventListener('input', function () { S.fam[S.pass].F6 = t.value; });
  var c = document.getElementById('gOk'); if (c) c.addEventListener('change', function () { S.ok[S.pass] = c.checked; render(); });
}

/* Выбор ответа — красная подсветка, лёгкая вибрация и пауза, как в диагностике */
var busy = false;
function pick(btn, then) {
  if (busy) return; busy = true;
  btn.classList.add('is-picked');
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  setTimeout(function () { busy = false; then(); }, 380);
}
function nextQ() { if (S.i < Q.length - 1) S.i++; else S.scr = 'result'; render(); }
function nextF() { if (S.fi < F.length - 1) S.fi++; else S.scr = 'famOk'; render(); }

APP.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled || busy) return;
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  switch (act) {
    case 'start': case 'restart': S = fresh(); S.scr = 'quiz'; break;
    case 'ans': S.ans[Q[S.i].id] = Number(v); pick(b, nextQ); return;
    case 'skip': S.ans[Q[S.i].id] = null; nextQ(); return;
    case 'back': if (S.i > 0) S.i--; else S.scr = 'intro'; break;
    case 'result': S.scr = 'result'; break;
    case 'png': card(); return;
    case 'share': share(); return;
    case 'famIntro': S.scr = 'famIntro'; break;
    case 'famStart': S.scr = 'famQ'; S.fi = 0; S.pass = 0; S.fam = [{}, {}]; S.ok = [false, false]; break;
    case 'fAns': S.fam[S.pass][F[S.fi].id] = F[S.fi].o[Number(v)]; pick(b, nextF); return;
    case 'fTog': {
      var q = F[S.fi], val = q.o[Number(v)], arr = (S.fam[S.pass][q.id] || []).slice();
      var at = arr.indexOf(val); if (at > -1) arr.splice(at, 1); else if (arr.length < (q.max || 9)) arr.push(val);
      S.fam[S.pass][q.id] = arr; break; }
    case 'fMx': { var p = v.split('|'), qq = F[S.fi], o = S.fam[S.pass][qq.id] || {}; o[qq.o[Number(p[0])]] = p[1]; S.fam[S.pass][qq.id] = o; break; }
    case 'fNext': nextF(); return;
    case 'fSkip': S.fam[S.pass][F[S.fi].id] = null; nextF(); return;
    case 'fBack': if (S.fi > 0) S.fi--; else S.scr = S.pass === 0 ? 'famIntro' : 'famSwitch'; break;
    case 'fApprove': S.scr = S.pass === 0 ? 'famSwitch' : 'famRes'; break;
    case 'fDecline': S.ok[S.pass] = false; S.scr = 'famRes'; break;
    case 'fSecond': S.pass = 1; S.fi = 0; S.scr = 'famQ'; break;
  }
  render();
});

/* ── Карточка для сторис (1080×1920) в цветах Impact Consulting ── */
function status(t) { var el = document.getElementById('gStatus'); if (el) el.textContent = t; }
function shareText() {
  var r = compute(), names = r.leaders.map(function (x) { return P[x.code].name; });
  return 'Я прошёл(ла) игру «Кто вы в бизнесе?» от FBT Online. Моя роль: ' + (r.mode === 'wide' ? 'универсал (' + names.join(', ').toLowerCase() + ')' : names.join(' + ') || '—') +
    '. А вы кто в бизнесе? ' + location.origin + location.pathname;
}
function wrapText(g, text, x, y, maxW, lh) {
  var words = text.split(' '), line = '';
  words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t; });
  if (line) g.fillText(line, x, y); return y + lh;
}
function loadImg(src) { return new Promise(function (ok) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = function () { ok(null); }; i.src = src; }); }
function card() {
  var r = compute(), L = r.leaders.length ? r.leaders : r.agg.slice(0, 2);
  var FF = "'Golos Text', -apple-system, Arial, sans-serif";
  status('Готовлю картинку…');
  var fonts = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('600 80px "Golos Text"'), document.fonts.load('500 40px "Golos Text"')]).catch(function () {}) : Promise.resolve();
  fonts.then(function () { return Promise.all(L.slice(0, 2).map(function (x) { return loadImg(IC + P[x.code].icon + '.webp'); })); }).then(function (ims) {
    var c = document.createElement('canvas'); c.width = 1080; c.height = 1920; var g = c.getContext('2d');
    g.fillStyle = '#181818'; g.fillRect(0, 0, 1080, 1920);
    g.fillStyle = '#C60000'; g.fillRect(90, 150, 12, 64);
    g.fillStyle = '#FFFFFF'; g.font = '600 38px ' + FF; g.fillText('IMPACT CONSULTING · FBT ONLINE', 126, 196);
    g.fillStyle = '#FF6B6B'; g.font = '600 40px ' + FF; g.fillText('МОЯ РОЛЬ В БИЗНЕСЕ', 90, 400);
    ims.forEach(function (im, k) {
      var x = 90 + k * 290, y = 470; g.save(); g.translate(x + 120, y + 120); g.rotate((k ? 5 : -5) * Math.PI / 180);
      g.fillStyle = '#FBF7F0'; g.beginPath(); if (g.roundRect) g.roundRect(-120, -120, 240, 240, 50); else g.rect(-120, -120, 240, 240); g.fill();
      if (im) g.drawImage(im, -96, -96, 192, 192); g.restore();
    });
    var names = r.mode === 'wide' ? ['Универсал'] : L.map(function (x) { return P[x.code].name; });
    var y = 900;
    names.forEach(function (n, k) { g.fillStyle = k ? '#A2C3CD' : '#FFFFFF'; g.font = '600 ' + (n.length > 12 ? 100 : 120) + 'px ' + FF; g.fillText((k ? '+ ' : '') + n, 90, y); y += 140; });
    g.fillStyle = '#C60000'; g.fillRect(90, y - 40, 300, 10);
    y += 60;
    var p0 = L[0] ? P[L[0].code] : null;
    var lines = r.mode === 'wide' ? r.leaders.map(function (x) { return P[x.code].name; }) : (p0 ? p0.tasks : []);
    if (lines.length) { g.fillStyle = '#9A9AA0'; g.font = '600 34px ' + FF; g.fillText(r.mode === 'wide' ? 'МНЕ БЛИЗКИ РОЛИ:' : 'МНЕ ИНТЕРЕСНО:', 90, y); y += 70; g.font = '500 46px ' + FF;
      lines.forEach(function (t) { g.fillStyle = '#C60000'; g.beginPath(); g.arc(104, y - 16, 10, 0, 7); g.fill(); g.fillStyle = '#F2F2F4'; y = wrapText(g, t, 136, y, 860, 60) + 10; }); }
    g.fillStyle = '#232325'; g.fillRect(0, 1620, 1080, 300);
    g.fillStyle = '#FFFFFF'; g.font = '600 52px ' + FF; g.fillText('А вы кто в бизнесе?', 90, 1730);
    g.fillStyle = '#A2C3CD'; g.font = '500 38px ' + FF; g.fillText('fbt-online.pages.dev/igra-profil', 90, 1800);
    c.toBlob(function (blob) {
      if (!blob) { status('Не получилось сохранить картинку'); return; }
      var file = null; try { file = new File([blob], 'kto-vy-v-biznese.png', { type: 'image/png' }); } catch (e) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: 'Кто вы в бизнесе?' }).then(function () { status('Готово'); }).catch(function () { status(''); });
        return;
      }
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kto-vy-v-biznese.png'; document.body.appendChild(a); a.click(); a.remove();
      status('Картинка сохранена');
    }, 'image/png');
  });
}
function share() {
  var t = shareText();
  if (navigator.share) { navigator.share({ title: 'Кто вы в бизнесе?', text: t }).catch(function () {}); return; }
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(t).then(function () { status('Текст скопирован — вставьте его в сообщение'); }, function () { status(t); }); return; }
  status(t);
}

render();
})();
