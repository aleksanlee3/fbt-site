/* 20.11: баллы. Ситуация: 1-е место — 3 балла, 2-е — 2, 3-е — 1, 4-е — 0 (каждый архетип встречается 5 раз, максимум 15).
   Опыт (3 вопроса): +2 своему архетипу. Уточнение: +1,5 выбранному. */
var ORDER = ['IN', 'CR', 'CL', 'SA', 'OP', 'CO', 'TE', 'MA'];
function scores(noDuel) {
  var pts = {}, cnt = {}, sc = {}, done = 0;
  AX.forEach(function (c) { pts[c] = 0; cnt[c] = 0; });
  Q.forEach(function (q) {
    if (!q.rank) return;
    var a = S.ans[q.id]; if (!Array.isArray(a) || a.length < q.a.length) return;
    done++; a.forEach(function (k, pos) { var c = q.a[k][1]; pts[c] += 3 - pos; cnt[c]++; });
  });
  AX.forEach(function (c) { sc[c] = cnt[c] ? pts[c] / cnt[c] * 5 : 0; });
  Q.forEach(function (q) { if (!q.exp) return; var k = S.ans[q.id]; if (k == null) return; var c = q.a[k][2]; if (c && sc[c] != null) sc[c] += 2; });
  if (!noDuel) (S.duels || []).forEach(function (d) { var w = (S.dans || {})[d.join('|')]; if (w && sc[w] != null) sc[w] += 1.5; });
  return { sc: sc, done: done };
}
function ranked(sc) { return AX.slice().sort(function (a, b) { return sc[b] - sc[a] || ORDER.indexOf(a) - ORDER.indexOf(b); }); }
function duelPairs() {
  var s = scores(true); if (s.done < 5) return [];
  var a = ranked(s.sc), v = s.sc, out = [];
  if (v[a[0]] - v[a[1]] <= 1) out.push([a[0], a[1]]);
  if (v[a[1]] - v[a[2]] <= 1) out.push([a[1], a[2]]);
  if (out.length === 2 && v[a[0]] - v[a[2]] <= 1) out.push([a[0], a[2]]);
  return out;
}
function compute() {
  var s = scores(), agg = ranked(s.sc).map(function (c) { return { code: c, avg: s.sc[c] }; });
  var mode = s.done < 5 ? 'few' : (agg[0].avg - agg[2].avg <= 1 && agg[0].avg - agg[3].avg <= 2) ? 'wide' : 'clear';
  var leaders = mode === 'few' ? [] : agg.slice(0, mode === 'wide' ? 3 : 2);
  return { agg: agg, answered: s.done, leaders: leaders, mode: mode };
}

/* 20.11: события игры → журнал бота (как на остальных страницах): начал, дошёл до результата, оценка «насколько про вас» */
function gev(name, data) {

    if (!token && !anon) anon = (Date.now().toString(36) + Math.random().toString(36).slice(2, 12)).replace(/[^a-z0-9]/g, '').slice(0, 20);
    var body = token ? { token: token } : { anon: anon };

APP.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.disabled || busy) return;

  switch (act) {

    case 'rank': {

      if (ra.length >= rn) ra = [rk]; else if (rat > -1) ra = ra.slice(0, rat); else ra.push(rk);
      if (ra.length === rn - 1) for (var z = 0; z < rn; z++) if (ra.indexOf(z) < 0) ra.push(z);
      S.ans[rq.id] = ra; buzz(); paintRank(rq);
      if (ra.length === rn) { busy = true; setTimeout(function () { busy = false; nextQ(); }, 650); }

    case 'rankNext': if (rankState(Q[S.i]).length >= Q[S.i].a.length) nextQ(); return;
    case 'duel': S.dans[S.duels[S.di].join('|')] = v; pick(b, nextD); return;

    case 'ans': S.ans[Q[S.i].id] = Number(v); pick(b, nextQ); return;
    case 'skip': S.ans[Q[S.i].id] = null; nextQ(); return;
    case 'back':

    case 'fNext': nextF(); return;

/* 20.11: сцена с героями на первом экране двигается за мышкой (на телефоне — за пальцем и наклоном) */
(function () {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, run = false;
  function set(x, y) { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); if (!run) { run = true; requestAnimationFrame(tick); } }
  function tick() {
    cx += (tx - cx) * .08; cy += (ty - cy) * .08;
    var st = document.querySelector('.g-stage');
    if (st) { st.style.setProperty('--mx', cx.toFixed(3)); st.style.setProperty('--my', cy.toFixed(3)); }
    if (Math.abs(tx - cx) + Math.abs(ty - cy) > .002) requestAnimationFrame(tick); else run = false;
  }
  window.addEventListener('pointermove', function (e) { set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); }, { passive: true });
  window.addEventListener('deviceorientation', function (e) { if (e.gamma == null) return; set(e.gamma / 25, (e.beta - 45) / 25); }, { passive: true });
})();
