function radarGeo(CX, CY, R) {
  return function (k, v) { var a = (-90 + k * 45) * Math.PI / 180; return [CX + Math.cos(a) * R * v / 4, CY + Math.sin(a) * R * v / 4]; };
}
/* 20.11: диаграмма бизнес-архетипа — мягкая форма, головы героев по кругу, проценты вместо квадратиков */
function shares(vals) {
  var sum = 0; AX.forEach(function (c) { sum += Math.max(0, vals[c] || 0) + .25; });
  var out = {}, tot = 0, big = AX[0];
  AX.forEach(function (c) { out[c] = Math.round((Math.max(0, vals[c] || 0) + .25) / sum * 100); tot += out[c]; if (out[c] > out[big]) big = c; });
  out[big] += 100 - tot; return out;
}
function radarSVG(vals, tops, label) {
  var pc = shares(vals), mx = Math.max.apply(null, AX.map(function (c) { return pc[c]; })) || 1;
  var CX = 220, CY = 222, R = 128, pt = radarGeo(CX, CY, R), LIME = '#C8F560';
  function f(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }
  function val(c) { return Math.max(.45, Math.sqrt(pc[c] / mx) * 4); }
  var h = '<svg class="g-radar" viewBox="0 0 440 450" role="img" aria-label="' + esc(label) + '">';
  [4, 3, 2, 1].forEach(function (k) { h += '<polygon points="' + AX.map(function (_, n) { return f(pt(n, k)); }).join(' ') + '" fill="' + (k === 4 ? 'rgba(255,255,255,.04)' : 'none') + '" stroke="rgba(255,255,255,' + (k === 4 ? '.34' : '.16') + ')" stroke-width="1"/>'; });
  AX.forEach(function (_, k) { var p = pt(k, 4); h += '<line x1="' + CX + '" y1="' + CY + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="rgba(255,255,255,.14)"/>'; });
  h += '<polygon points="' + AX.map(function (c, k) { return f(pt(k, val(c))); }).join(' ') + '" fill="rgba(200,245,96,.30)" stroke="' + LIME + '" stroke-width="3" stroke-linejoin="round"/>';
  AX.forEach(function (c, k) { var p = pt(k, val(c)), top = tops.indexOf(c) > -1;
    h += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (top ? 7 : 5) + '" fill="' + (top ? LIME : '#0F3B2F') + '" stroke="' + (top ? '#fff' : LIME) + '" stroke-width="2"/>'; });
  var ip = radarGeo(CX, CY, R + 50);
  AX.forEach(function (c, k) {
    var p = ip(k, 4), top = tops.indexOf(c) > -1, s = top ? 72 : 62, y = p[1] - 9;
    h += '<circle cx="' + p[0].toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + (s / 2) + '" fill="' + (top ? 'rgba(200,245,96,.20)' : 'rgba(255,255,255,.10)') + '"' + (top ? ' stroke="' + LIME + '" stroke-width="2.5"' : '') + '/>';
    h += '<image href="' + IH + SLUG[c] + '.webp" x="' + (p[0] - s / 2).toFixed(1) + '" y="' + (y - s / 2).toFixed(1) + '" width="' + s + '" height="' + s + '"/>';
    h += '<text x="' + p[0].toFixed(1) + '" y="' + (y + s / 2 + 18).toFixed(1) + '" text-anchor="middle" font-size="17" font-weight="800" fill="' + (top ? LIME : '#FFFFFF') + '">' + pc[c] + '%</text>';

}
