      '<ul class="g-facts"><li>' + ipic('spisok') + '<span>18 вопросов</span></li><li>' + ipic('chasy') + '<span>5 минут</span></li><li>' + ipic('rol') + '<span>Ваша роль</span></li><li>' + ipic('rost') + '<span>Шаг роста</span></li></ul>' +
      '<div class="t-name"><label for="tName">Как вас зовут?</label><input id="tName" type="text" autocomplete="given-name" maxlength="40" placeholder="Например, Дильноза" value="' + esc(S.name) + '"><small>Имя увидит только тренер в общей сводке группы.</small></div>' +
      '<span class="g-glow"><button type="button" class="btn btn--primary btn--shine btn--lg btn--block mt-14" data-act="start">Определить свой архетип' + arrow() + '</button></span>' +
      '<div class="g-how"><b>Как отвечать</b><p>Представьте, что вы всё умеете и у вас есть время и деньги. Выбирайте то, что вам по душе, а не то, что уже получается. В каждом вопросе 3 ответа — нажимайте на них по порядку:</p>' + howList() + '</div>' +
      '<p class="g-note">Это игра, а не научный тест. Она показывает, что вам ближе, но не оценивает способности.</p>' +
    '</div>'
  );
}
function pbar(){
  var exp = S.i >= 15, n1 = Math.min(S.i, 15), n2 = Math.max(0, S.i - 15);
  var seg = function(w, label, now){ return '<div class="g-pb-seg' + (now ? ' now' : w >= 100 ? ' done' : '') + '"><span class="g-pb-track"><i style="width:' + w + '%"></i></span><small>' + label + '</small></div>'; };
  return '<div class="g-pb"><div class="g-pb-h"><b>' + (exp ? 'Часть 2 · Ваш реальный опыт' : 'Часть 1 · Ситуации') + '</b><span>' + (S.i + 1) + ' / ' + Q.length + '</span></div>' +
    '<div class="g-pb-row two">' + seg(exp ? 100 : Math.max(4, Math.round(n1 / 15 * 100)), '1 · Ситуации', !exp) + seg(exp ? Math.max(4, Math.round(n2 / 3 * 100)) : 0, '2 · Опыт', exp) + '</div></div>';
}
function vQuiz(){
  var q = Q[S.i], arr = S.ans[S.i] || [], full = arr.length >= 3;
  var opts = S.ord[S.i].map(function(k){
    var at = arr.indexOf(k);
    return '<button type="button" class="opt opt--rank' + (at > -1 ? ' is-ranked r' + (at + 1) : '') + '" data-act="rank" data-v="' + k + '"><span class="g-em g-rk" aria-hidden="true">' + (at > -1 ? at + 1 : '') + '</span><span class="g-rk-t"><span>' + nb(esc(q.a[k])) + '</span><em class="g-rk-cap">' + (at > -1 ? RANK_CAP[at] : '') + '</em></span></button>';
  }).join('');
  return sec(
    '<div class="g-panel">' + pbar() +
      '<img class="g-sit" src="' + SIT[S.i + 1] + '" alt="" width="1024" height="688">' +
      '<h2 class="g-q">' + nb(esc(q.t)) + '</h2>' +
      (S.i === 0 && !arr.length ? '<div class="g-tip"><b>Как отвечать.</b> Нажимайте на ответы по порядку. Первым — тот, что больше всего про вас: он получит номер 1 «это про меня». Вторым — тот, что похож на вас: номер 2 «похоже на меня». Последний встанет сам: номер 3 «меньше всего про меня». Ошиблись — нажмите на ответ ещё раз.</div>' : '') +
      '<p class="g-rank-how"><span><i>1</i>это про меня</span><span><i>3</i>меньше всего про меня</span></p>' +
      '<div class="g-opts" role="group" aria-label="Ваш ответ">' + opts + '</div>' +
      '<p class="g-hint" id="gRankHint" role="status">' + RANK_HINT[Math.min(arr.length, 3)] + '</p>' +
      '<div class="g-foot"><button type="button" class="btn btn--sm" data-act="back">← Назад</button>' +
        (full ? '<button type="button" class="btn btn--sm btn--primary" data-act="next">Дальше' + arrow() + '</button>' : '<button type="button" class="g-skip" data-act="reset">Расставить заново</button>') + '</div>' +
    '</div>'
  );
}
function vInter(){
  return sec('<div class="g-panel t-inter">' + pbar() + '<div style="font-size:56px;margin-top:10px">🕰️</div><h2>Теперь вспомните,<br>как было на самом деле</h2><p>Ещё 3 вопроса — про ваш реальный опыт, а не про мечты.</p>' +
    '<span class="g-glow"><button type="button" class="btn btn--primary btn--shine btn--lg btn--block mt-14" data-act="exp">Дальше' + arrow() + '</button></span></div>');
}
function vTie(){
  var q = S.ties[S.ti];
  var keys = Object.keys(q.a); if (S.ti % 2) keys.reverse();
  return sec(
    '<div class="g-panel">' +
      '<div class="g-pb"><div class="g-pb-h"><b>Последнее уточнение</b><span>' + (S.ti + 1) + ' / ' + S.ties.length + '</span></div><div class="g-pb-row two"><div class="g-pb-seg done"><span class="g-pb-track"><i style="width:100%"></i></span><small>1 · Ситуации</small></div><div class="g-pb-seg done"><span class="g-pb-track"><i style="width:100%"></i></span><small>2 · Опыт</small></div></div></div>' +
      '<p class="g-story g-story--big">Почти готово. Две роли у вас идут рядом — выберите, что ближе.</p>' +
      '<h2 class="g-q">' + nb(esc(q.t)) + '</h2>' +
      '<div class="g-opts" role="radiogroup" aria-label="Ваш ответ">' + keys.map(function(k, n){
        return '<button type="button" class="opt" role="radio" aria-checked="false" data-act="tie" data-v="' + k + '"><span class="g-em" aria-hidden="true">' + 'АБ'.charAt(n) + '</span><span>' + esc(q.a[k]) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="g-foot"><span></span><button type="button" class="g-skip" data-act="tieSkip">Одинаково</button></div>' +
    '</div>'
  );
}
function card(icon, title, body, cls){ return '<div class="t-card' + (cls ? ' ' + cls : '') + '"><h3><i>' + ipic(icon) + '</i>' + title + '</h3>' + body + '</div>'; }
function vResult(){
  var f = S.final, main = R[f.main], second = R[f.second], pair = PAIRS[pairKey(f.main, f.second)], s = f.scores;
  var max = Math.max(s.O, s.T, s.N) || 1, rk = f.rk;
  return sec(
    '<div class="t-res">' +
      '<div class="eyebrow">ВАШ АРХЕТИП</div>' +
      '<img src="' + main.img + '" alt="' + main.name + ' — ' + main.animal + '">' +
      '<div class="t-you">' + (f.universal ? 'Вы — Универсал. Чуть сильнее:' : 'Вы —') + '</div>' +
      '<h1>' + main.name + '</h1><div class="t-motto">«' + main.motto + '»</div>' +
    '</div>' +
    card('tsel', 'Ваша суть', '<p>' + nb(esc(main.core)) + '</p>', 'dark') +
    card('sila', 'Ваши сильные стороны', '<ul>' + main.strong.map(function(x){ return '<li>' + nb(esc(x)) + '</li>'; }).join('') + '</ul>') +
    card('komanda', 'Ваша пара ролей', '<p>' + (f.universal ? '<b>Все три роли у вас почти равны.</b> Вы можете закрыть любую роль в обучении. Важно выбрать, на чём сделать упор сейчас. Вторая по силе роль — ' + esc(second.name.toLowerCase()) + '.' : '<b>' + main.name + ' + ' + second.name + ' = «' + pair.name + '».</b> ' + nb(esc(pair.text))) + '</p>') +
    card('zvezda', 'Где вы сияете на тренинге', '<p>' + nb(esc(main.shine)) + '</p>') +
    card('vnimanie', 'На что обратить внимание', '<p>' + nb(esc(main.blind)) + '</p>') +
    card('rost', 'Шаг роста на эту неделю', '<p>' + nb(esc(main.step)) + '</p>', 'red') +
    card('grafik', 'Ваши три роли', '<div class="t-bars">' + rk.map(function(k){ return '<div class="t-bar"><b>' + R[k].name + '</b><s><i style="background:' + R[k].color + '" data-w="' + Math.round(s[k] / max * 100) + '"></i></s></div>'; }).join('') + '</div>') +
    card('ruchka', 'Насколько это про вас?',
      '<div class="t-rate">' + [1,2,3,4,5].map(function(n){ return '<button type="button" data-act="rate" data-v="' + n + '"' + (S.rating === n ? ' class="on"' : '') + '>' + n + '</button>'; }).join('') + '</div>' +
      '<div class="t-rate-l"><span>совсем не про меня</span><span>точно про меня</span></div>' +
      '<textarea id="tComment" placeholder="Что совпало, а что нет? Напишите пару слов"></textarea>' +
      '<span class="g-glow"><button type="button" class="btn btn--primary btn--lg btn--block mt-14" data-act="send"' + (S.rating ? '' : ' disabled') + '>Отправить</button></span>' +
      '<div class="t-thanks" id="tThanks">Спасибо! Ответ отправлен.</div>') +
    '<button type="button" class="btn btn--block mt-14" data-act="again">Пройти ещё раз</button>'
  );
}

var view = 'start';
function render(v){ view = v || view;
  APP.innerHTML = view === 'start' ? vStart() : view === 'quiz' ? vQuiz() : view === 'inter' ? vInter() : view === 'tie' ? vTie() : vResult();
  window.scrollTo(0, 0);
  if (view === 'result') setTimeout(function(){ Array.prototype.forEach.call(APP.querySelectorAll('.t-bar i'), function(i){ i.style.width = i.getAttribute('data-w') + '%'; }); }, 150);
}
function paintRank(){
  var arr = S.ans[S.i] || [];
  Array.prototype.forEach.call(APP.querySelectorAll('[data-act="rank"]'), function(b){
    var at = arr.indexOf(b.getAttribute('data-v'));
    b.className = 'opt opt--rank' + (at > -1 ? ' is-ranked r' + (at + 1) : '');
    b.querySelector('.g-rk').textContent = at > -1 ? at + 1 : '';
    b.querySelector('.g-rk-cap').textContent = at > -1 ? RANK_CAP[at] : '';
  });
  var h = document.getElementById('gRankHint'); if (h) h.textContent = RANK_HINT[Math.min(arr.length, 3)];
  var t = APP.querySelector('.g-tip'); if (t && arr.length) t.style.display = 'none';
  var foot = APP.querySelector('.g-foot');
  if (foot) foot.lastElementChild.outerHTML = arr.length >= 3 ? '<button type="button" class="btn btn--sm btn--primary" data-act="next">Дальше' + arrow() + '</button>' : '<button type="button" class="g-skip" data-act="reset">Расставить заново</button>';
}
var auto = null;
function next(){
  clearTimeout(auto);
  if ((S.ans[S.i] || []).length < 3) return;
  if (S.i === 14) { S.i = 15; render('inter'); return; }
  if (S.i < Q.length - 1) { S.i++; render('quiz'); return; }
  finish();
}
function baseScores(){
  var s = {O:0,T:0,N:0};
  S.ans.forEach(function(a, i){ if (!a || a.length < 3) return; var w = Q[i].exp ? 1.5 : 1; a.forEach(function(k, r){ s[k] += (2 - r) * w; }); });
  return s;
}
function ranked(s){ return ['O','T','N'].sort(function(a, b){ return s[b] - s[a] || 'OTN'.indexOf(a) - 'OTN'.indexOf(b); }); }
function finish(){
  var s = baseScores(), rk = ranked(s);
  if (s[rk[0]] - s[rk[2]] > 3 && s[rk[0]] - s[rk[1]] <= 2) { S.ties = TIE[pairKey(rk[0], rk[1])]; S.ti = 0; render('tie'); return; }
  result();
}
function result(){
  var s = baseScores(); ['O','T','N'].forEach(function(k){ s[k] += S.tieAdd[k]; });
  var rk = ranked(s);
  S.final = { main: rk[0], second: rk[1], rk: rk, universal: (s[rk[0]] - s[rk[2]]) <= 3, scores: s };
  render('result'); send();
}
function send(){
  var f = S.final; if (!f) return;
  var c = document.getElementById('tComment');
  var payload = { id: S.id, group: GROUP, name: S.name.slice(0,40), main: R[f.main].name, second: R[f.second].name,
    pair: f.universal ? 'Универсал' : PAIRS[pairKey(f.main, f.second)].name, o: f.scores.O, t: f.scores.T, n: f.scores.N,
    rating: S.rating || '', comment: c ? c.value.trim().slice(0,1000) : '', answers: S.ans.map(function(a){ return a ? a.join('') : ''; }).join(' '), ua: navigator.userAgent.slice(0,120) };
  try { localStorage.setItem('tot_last', JSON.stringify(payload)); } catch (e) {}
  if (!CFG.SCRIPT_URL) return;
  try { fetch(CFG.SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); } catch (e) {}
}

APP.addEventListener('input', function(e){ if (e.target.id === 'tName') S.name = e.target.value.trim(); });
APP.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
  if (act === 'start') { var n = document.getElementById('tName'); S.name = n ? n.value.trim() : ''; S.i = 0; render('quiz'); }
  else if (act === 'rank') {
    var arr = (S.ans[S.i] || []).slice(), at = arr.indexOf(v);
    if (at > -1) arr = arr.slice(0, at); else { arr.push(v); if (arr.length === 2) arr.push(['O','T','N'].filter(function(x){ return arr.indexOf(x) < 0; })[0]); }
    S.ans[S.i] = arr; paintRank(); clearTimeout(auto);
    if (arr.length === 3) auto = setTimeout(next, 900);
  }
  else if (act === 'reset') { S.ans[S.i] = []; paintRank(); }
  else if (act === 'next') next();
  else if (act === 'exp') render('quiz');
  else if (act === 'back') { clearTimeout(auto); if (S.i === 0) render('start'); else { S.i--; render('quiz'); } }
  else if (act === 'tie' || act === 'tieSkip') { if (act === 'tie') S.tieAdd[v] += 2; S.ti++; if (S.ti < S.ties.length) render('tie'); else result(); }
  else if (act === 'rate') { S.rating = +v; Array.prototype.forEach.call(APP.querySelectorAll('[data-act="rate"]'), function(x){ x.classList.toggle('on', x === b); }); var sb = APP.querySelector('[data-act="send"]'); if (sb) sb.disabled = false; }
  else if (act === 'send') { send(); b.disabled = true; document.getElementById('tThanks').style.display = 'block'; }
  else if (act === 'again') location.reload();
});
render('start');

// сцена с героями двигается за мышкой, пальцем и наклоном телефона
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var tx = 0, ty = 0, cx = 0, cy = 0, run = false;
  function set(x, y){ tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); if (!run) { run = true; requestAnimationFrame(tick); } }
  function tick(){ cx += (tx - cx) * .08; cy += (ty - cy) * .08; var st = document.getElementById('tStage');
    if (st) { st.style.setProperty('--mx', cx.toFixed(3)); st.style.setProperty('--my', cy.toFixed(3)); }
    if (Math.abs(tx - cx) + Math.abs(ty - cy) > .002) requestAnimationFrame(tick); else run = false; }
  window.addEventListener('pointermove', function(e){ set(e.clientX / innerWidth * 2 - 1, e.clientY / innerHeight * 2 - 1); }, { passive: true });
  window.addEventListener('touchmove', function(e){ var t = e.touches[0]; if (t) set(t.clientX / innerWidth * 2 - 1, t.clientY / innerHeight * 2 - 1); }, { passive: true });
  window.addEventListener('deviceorientation', function(e){ if (e.gamma == null) return; set(e.gamma / 25, (e.beta - 45) / 25); }, { passive: true });
})();
})();
</script>
